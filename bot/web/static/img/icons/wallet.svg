<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <defs>
    <!-- Credit Card -->
    <linearGradient id="fluentCardGrad" x1="9" y1="2" x2="20" y2="7" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <!-- Main Wallet Leather Body -->
    <linearGradient id="fluentWalletBody" x1="3" y1="5" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b"/>
      <stop offset="0.45" stop-color="#d97706"/>
      <stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <!-- Wallet Flap & Shadow -->
    <linearGradient id="fluentWalletFlap" x1="14" y1="12" x2="21" y2="16" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="fluentWalletInner" x1="3" y1="5" x2="19" y2="8" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78350f"/>
      <stop offset="1" stop-color="#92400e"/>
    </linearGradient>
  </defs>
  <g fill="none">
    <!-- Credit Card peeking out -->
    <path fill="url(#fluentCardGrad)" d="M14.356 2.595a.25.25 0 0 1 .361-.032l.922.812L12.739 7h1.92l2.106-2.632l1.652 1.457a.25.25 0 0 1 .026.348l-.69.827h1.944a1.75 1.75 0 0 0-.288-2.3l-3.7-3.263a1.75 1.75 0 0 0-2.531.23L8.976 7h1.91z"/>
    <!-- Card Chip Line -->
    <rect x="12" y="3.5" width="2.5" height="1.8" rx="0.4" fill="#fef08a" opacity="0.9"/>
    <!-- Wallet Base Body -->
    <path fill="url(#fluentWalletBody)" d="M3 7.25A2.25 2.25 0 0 1 5.25 5h13.5A2.25 2.25 0 0 1 21 7.25v10.5A3.25 3.25 0 0 1 17.75 21H6.25A3.25 3.25 0 0 1 3 17.75z"/>
    <!-- Inner Top Slot Edge -->
    <path fill="url(#fluentWalletInner)" opacity="0.4" d="M5.25 6.5a.75.75 0 0 0 0 1.5h13a3.25 3.25 0 0 1 2.75 1.5V7.25A2.25 2.25 0 0 0 18.75 5H5.25z"/>
    <!-- Wallet Stitching Accent -->
    <path d="M4.5 8v9.5c0 1 .8 1.8 1.8 1.8h11.4c1 0 1.8-.8 1.8-1.8V8" stroke="rgba(255,255,255,0.22)" stroke-width="0.8" stroke-dasharray="1.5 1.2"/>
    <!-- Wallet Clasp Tab -->
    <rect x="14.5" y="11.5" width="6" height="4.5" rx="2.25" fill="url(#fluentWalletFlap)"/>
    <!-- Golden Snap Button -->
    <circle cx="17.5" cy="13.75" r="1.1" fill="#b45309"/>
    <circle cx="17.5" cy="13.75" r="0.5" fill="#fef08a"/>
  </g>
</svg>