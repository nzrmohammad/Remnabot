name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: remnabot_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Tailwind CSS Build
        run: |
          npm run build:css
          git diff --exit-code -- bot/web/static/css/tailwind.min.css

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff bandit

      - name: Lint Python Code with Ruff
        run: |
          ruff check bot/

      - name: Security Scan with Bandit
        run: |
          bandit -r bot/ -ll -q -x bot/web/static/

      - name: Verify JavaScript Syntax & Tests
        run: |
          npm run test:js
          for f in bot/web/static/js/*.js; do
            node --check "$f"
          done

      - name: Run Test Suite (Real PostgreSQL)
        env:
          BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
          ADMIN_CHAT_ID: "-1001234567890"
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/remnabot_test"
          REMNAWAVE_BASE_URL: "https://mock-panel.local"
          REMNAWAVE_TOKEN: "mock_token"
        run: |
          python -m pytest -v
