name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'
            cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Verify Tailwind CSS Build
        run: |
          npm run build:css
          git diff --exit-code -- bot/web/static/css/tailwind.min.css

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-anyio

      - name: Verify JavaScript Syntax & Tests
        run: |
          npm run test:js
          for f in bot/web/static/js/*.js; do
            node --check "$f"
          done

      - name: Run Test Suite
        env:
          BOT_TOKEN: "123456789:ABCdefGHIjklMNOpqrsTUVwxyz"
          ADMIN_CHAT_ID: "-1001234567890"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REMNAWAVE_BASE_URL: "https://mock-panel.local"
          REMNAWAVE_TOKEN: "mock_token"
        run: |
          python -m pytest -v
