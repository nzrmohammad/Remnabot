services:
  db:
    image: postgres:16-alpine
    container_name: remnawave-bot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remnabot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-remnabot}
      POSTGRES_DB: ${POSTGRES_DB:-remnabot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remnabot}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: remnawave-bot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  bot:
    build: .
    container_name: remnawave-bot
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-remnabot}:${POSTGRES_PASSWORD:-remnabot}@db:5432/${POSTGRES_DB:-remnabot}}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    # Connects to Remnawave panel running on host or Docker via host.docker.internal
    volumes:
      - botbackups:/app/backups
      - botdata:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  botbackups:
  botdata:
